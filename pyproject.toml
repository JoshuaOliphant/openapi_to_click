[project]
name = "openapi-to-cli"
authors = [{ name = "Joshua Oliphant", email = "joshua.oliphant@hey.com" }]
version = "0.2.0"
description = "Generate Click-based command-line interfaces from OpenAPI 3.x specs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.0",
    "jinja2>=3.1.6",
    "openapi-python-client>=0.28.3",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "tomlkit>=0.13.2",
]

[project.scripts]
openapi-to-cli = "openapi_to_cli.cli:main"

[project.urls]
Homepage = "https://github.com/JoshuaOliphant/openapi_to_click"
Repository = "https://github.com/JoshuaOliphant/openapi_to_click"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openapi_to_cli"]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
    # Used by the example app and the end-to-end integration test, which
    # generates a CLI from the running app's live OpenAPI spec.
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# Depends(...) in argument defaults is the idiomatic FastAPI pattern.
"examples/**" = ["B008"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
